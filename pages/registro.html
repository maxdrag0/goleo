        <main class="container main">
            <h1 class="titulo-registro">REGISTRO</h1>
                <form action="./registro-exito.html" method="post" class="register-form" data-netlify="true" netlify>
                    <!--BASE-->
                        <div class="campo dos_columnas">
                            <label for="nombre">Nombre</label>
                            <input type="text" name="nombre" id="nombre" required>
                        </div>
                        <div class="campo dos_columnas">
                            <label for="apellido">Apellido</label>
                            <input type="text" name="apellido" id="apellido" required>
                        </div>
                        <div class="campo dos_columnas">
                            <label for="dni">DNI</label>
                            <input type="text" name="dni" id="dni" required>
                        </div>

                        <div class="campo tres_columnas">
                            <label for="mail">Mail</label>
                            <input type="text" name="mail" id="mail" required>
                        </div>
                        <div class="campo tres_columnas">
                            <label for="telefono">Telefono</label>
                            <input type="number" name="telefono" id="telefono" required>
                        </div>

                        <div class="campo tres_columnas">
                            <label for="usuario">Usuario</label>
                            <input type="text" name="usuario" id="usuario" required>
                        </div>
                        <div class="campo tres_columnas">
                            <label for="contraseña">Contraseña</label>
                            <input type="password" name="contraseña" id="contraseña" required>
                        </div>

                    <!--JUGADOR-->
                        <div class="campo tres_columnas">
                            <label for="posicion">Posicion</label>
                            <select name="posicion" id="posicion" required>
                                <option value="" disabled selected hidden>Selecciona tu posición</option>
                                <option value="arquero">Arquero</option>
                                <option value="defensor">Defensor</option>
                                <option value="mediocampista">Mediocampista</option>
                                <option value="delantero">Delantero</option>
                            </select>
                        </div>

                        <div class="campo tres_columnas">
                            <label for="pierna">Pierna Habil</label>
                            <select name="pierna" id="pierna" required>
                                <option value="" disabled selected hidden>Selecciona tu pierna hábil</option>
                                <option value="diestro">Diestro</option>
                                <option value="Zurdo">Zurdo</option>
                                <option value="ambidiestro">Ambidiestro</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-registro">
                            REGISTRARSE
                        </button>
                </form>
        </main>
